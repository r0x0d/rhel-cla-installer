argument_specs:
  main: &spec
    options:
      rhel_cla_provider:
        type: str
        required: yes
        choices:
          - vertex
          - ramalama

      ramalama_config:
        type: dict
        required: &ramalama_required "{{ rhel_cla_provider == 'ramalama' }}"
        options:
          api_key:
            type: str
            required: *ramalama_required

          base_url:
            type: str
            required: *ramalama_required

          default_model:
            type: str
            required: *ramalama_required

      vertex_config:
        type: dict
        required: &vertex_required "{{ rhel_cla_provider == 'vertex' }}"
        options:
          credentials_secret_name:
            type: str
            required: *vertex_required

          default_model:
            type: str

          location:
            type: str
            required: *vertex_required

          project_id:
            type: str
            required: *vertex_required


  k8s: *spec
