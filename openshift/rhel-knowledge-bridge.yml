---
kind: Template
apiVersion: template.openshift.io/v1
labels:
  template: "${NAME}"

metadata:
  name: "${NAME}"
  annotations:
    openshift.io/display-name: OKP MCP Server
    description: >-
      Deploys the OKP MCP server, providing tools for searching Red Hat
      documentation, CVEs, errata, and solutions via the Model Context Protocol.

objects:
  # ====== ServiceAccount ====== #
  - kind: ServiceAccount
    apiVersion: v1
    metadata:
      name: "${NAME}"
      labels:
        service: rhel-cla
        app: "${NAME}"

  # ====== Deployment ====== #
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: "${NAME}"
      labels:
        service: rhel-cla
        app: "${NAME}"

    spec:
      replicas: "${{REPLICAS}}"
      strategy:
        type: Recreate

      selector:
        matchLabels:
          app: "${NAME}"

      template:
        metadata:
          labels:
            service: rhel-cla
            app: "${NAME}"

        spec:
          serviceAccountName: "${NAME}"
          containers:
            - name: "${NAME}"
              image: "${IMAGE}:${IMAGE_TAG}"
              ports:
                - containerPort: 8000
                  protocol: TCP

              env:
                - name: MCP_TRANSPORT
                  value: streamable-http

                - name: MCP_PORT
                  value: "8000"

                - name: MCP_LOG_LEVEL
                  value: "${LOG_LEVEL}"

                - name: MCP_SOLR_URL
                  value: "${SOLR_BASE_URL}"

              livenessProbe:
                initialDelaySeconds: 5
                periodSeconds: 10
                failureThreshold: 3
                tcpSocket:
                  port: 8000

              readinessProbe:
                initialDelaySeconds: 5
                periodSeconds: 10
                failureThreshold: 3
                tcpSocket:
                  port: 8000

              resources:
                requests:
                  cpu: "${CPU_REQUEST}"
                  memory: "${MEMORY_REQUEST}"

                limits:
                  cpu: "${CPU_LIMIT}"
                  memory: "${MEMORY_LIMIT}"

  # ====== Service ====== #
  - apiVersion: v1
    kind: Service
    metadata:
      name: "${NAME}"
      labels:
        service: rhel-cla
        app: "${NAME}"

    spec:
      sessionAffinity: ClientIP
      ports:
        - port: 8000
          protocol: TCP
          targetPort: 8000

      selector:
        app: "${NAME}"

parameters:
  - name: NAME
    displayName: Application Name
    description: The name assigned to all objects in the template.
    value: rhel-knowledge-bridge
    required: true

  - name: IMAGE
    displayName: Container Image
    description: The container image to deploy.
    value: registry.redhat.io/rhel-cla/rhel-knowledge-bridge-rhel10
    required: true

  - name: IMAGE_TAG
    displayName: Image Tag
    description: The tag of the container image.
    value: v1.0.2-1793265163
    required: true

  - name: REPLICAS
    displayName: Replicas
    description: Number of replicas to deploy.
    value: "1"
    required: true

  - name: CPU_REQUEST
    displayName: CPU Request
    description: CPU request per pod.
    value: 250m

  - name: CPU_LIMIT
    displayName: CPU Limit
    description: CPU limit per pod.
    value: "1"

  - name: MEMORY_REQUEST
    displayName: Memory Request
    description: Memory request per pod.
    value: 256Mi

  - name: MEMORY_LIMIT
    displayName: Memory Limit
    description: Memory limit per pod.
    value: 512Mi

  - name: LOG_LEVEL
    displayName: Log Level
    description: >-
      Log level for the MCP server. Valid values: DEBUG, INFO,
      WARNING, ERROR, CRITICAL.
    value: INFO

  - name: SOLR_BASE_URL
    displayName: Solr Base URL
    description: Base URL of the OKP Solr instance.
    value: http://redhat-okp:8983
